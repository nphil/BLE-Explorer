<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="0.55" stop-color="#2743C9"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rune" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DDF6FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0B1030" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>
  <g filter="url(#shadow)" fill="none" stroke="url(#rune)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bluetooth rune, shifted left to make room for the signal arcs -->
    <path d="M214 104v304l102-88-186-158M130 350l186-158-102-88"/>
  </g>
  <g fill="none" stroke="#7DEBFF" stroke-linecap="round" stroke-width="26" opacity="0.95">
    <!-- scanning arcs, "studio" signal motif -->
    <path d="M356 214a62 62 0 0 1 0 84"/>
    <path d="M400 174a122 122 0 0 1 0 164" opacity="0.6"/>
  </g>
</svg>
