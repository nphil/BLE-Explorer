<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1B4D"/>
      <stop offset="0.5" stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.25" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D6F3FF"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>

  <!-- Shark silhouette (nose left, tail right). Shadow copy, then body. -->
  <defs>
    <path id="silhouette" d="
      M 62 264
      C 120 214, 190 194, 262 196
      C 270 172, 296 128, 340 98
      C 350 92, 358 100, 356 110
      C 348 150, 342 178, 334 204
      C 364 214, 392 228, 414 244
      C 436 214, 462 176, 488 150
      C 496 144, 504 150, 500 160
      C 488 200, 470 232, 454 260
      C 470 290, 488 322, 500 360
      C 504 370, 496 376, 488 370
      C 462 344, 436 314, 414 284
      C 386 300, 352 312, 316 318
      C 306 344, 292 366, 274 384
      C 266 392, 256 388, 256 380
      C 260 358, 260 340, 258 322
      C 186 322, 116 302, 62 264
      Z"/>
  </defs>
  <use href="#silhouette" fill="#06122F" opacity="0.32" transform="translate(0,12)"/>
  <use href="#silhouette" fill="url(#body)"/>

  <!-- Gill slits -->
  <g stroke="#1D4ED8" stroke-width="7" stroke-linecap="round" opacity="0.65" fill="none">
    <path d="M 236 246 q -5 16 0 32"/>
    <path d="M 256 248 q -5 16 0 32"/>
    <path d="M 276 250 q -5 16 0 32"/>
  </g>
  <!-- Eye -->
  <circle cx="126" cy="250" r="13" fill="#0B1B4D"/>
  <circle cx="131" cy="245" r="4.5" fill="#FFFFFF"/>

  <!-- Signal arcs from the nose -->
  <g fill="none" stroke="#7DEBFF" stroke-linecap="round" stroke-width="18">
    <path d="M 74 214 a 58 58 0 0 0 -16 44" opacity="0.95"/>
    <path d="M 56 168 a 106 106 0 0 0 -28 88" opacity="0.55"/>
  </g>
</svg>
