name: Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["android/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0 platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          BLE_STUDIO_VERSION: ${{ github.ref_name }}
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "../BLE-Studio-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/mapping/release/mapping.txt "../BLE-Studio-${GITHUB_REF_NAME}-mapping.txt"
          sha256sum "../BLE-Studio-${GITHUB_REF_NAME}.apk" > "../BLE-Studio-${GITHUB_REF_NAME}.apk.sha256"

      - name: Build debug APK (non-release)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          BLE_STUDIO_VERSION: 0.0.0-${{ github.sha }}
        run: ./gradlew :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: ble-studio-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Attach APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            BLE-Studio-${{ github.ref_name }}.apk
            BLE-Studio-${{ github.ref_name }}.apk.sha256
            BLE-Studio-${{ github.ref_name }}-mapping.txt
